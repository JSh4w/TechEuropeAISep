[project]
name = "bessible"
version = "0.1.0"
description = "BESS site assessment agent"
requires-python = ">=3.13,<3.15"
dependencies = [
    "httpx>=0.28.1",
    "modal>=1.5.5",
    "pydantic-ai-slim[anthropic,google,logfire,openai,temporal,typesafe]>=2.46.0",
    "pydantic-settings>=2.15.0",
    "shapely>=2.1.2",
    "temporalio>=1.33.0",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

# Pylance / pyright (the editor's checker). mypy with the pydantic plugin stays the source of truth.
[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["src", "scripts", "tests"]
# Pydantic models narrow inherited fields on purpose (e.g. `dataset: Literal["green-belt"]`).
reportIncompatibleVariableOverride = false

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["src"]
# Tests assert on parsed fixtures: Optional fields are read without None checks, models built by field name.
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalOperand = false
reportOptionalIterable = false
reportOperatorIssue = false
reportArgumentType = false
reportAttributeAccessIssue = false
reportCallIssue = false

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-shapely>=2.1.0.20260728",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "missing-trailing-comma",
    "missing-copyright-notice",
    "docstring-missing-returns",
    "docstring-missing-exception",
    "no-self-use",
    "non-empty-init-module"
    ]

[tool.ruff.lint.per-file-ignores]
# The hard checks are small `Proposal -> Check` functions whose names say what they check.
"src/bessible/possibility/hard.py" = ["undocumented-public-function"]
# A command-line script: prints, runs top to bottom, holds the map's JavaScript and UI text (en dashes intended).
"scripts/site_report.py" = [
    "print",
    "implicit-namespace-package",
    "any-type",
    "complex-structure",
    "too-many-statements",
    "too-many-locals",
    "too-many-branches",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-statements-in-try-clause",
    "line-too-long",
    "ambiguous-unicode-character-string",
    ]
"test_*" = [
    "ANN",
    "D",
    "PLC",
    "PLR",
    "S",
    "ASYNC",
    "line-too-long",
    "float-equality-comparison",
    "complex-structure",
    "implicit-namespace-package",
    "raise-vanilla-args",
    "raw-string-in-exception",
    ]
"tests/*" = [
    "ANN",
    "D",
    "PLC",
    "PLR",
    "S",
    "ASYNC",
    "line-too-long",
    "float-equality-comparison",
    "complex-structure",
    "implicit-namespace-package",
    "raise-vanilla-args",
    "raw-string-in-exception",
    ]
"src/bessible/activities.py" = ["TC"]
"src/bessible/workflow.py" = ["TC"]

[tool.ruff.lint.flake8-type-checking]
# Ruff does not follow inheritance across modules, so our pydantic base classes are listed too.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "bessible.api.base.ApiRequest",
    "bessible.api.base.ApiResponse",
    "bessible.api.base.NullMarkerResponse",
    "bessible.api.ckan.CkanResponse",
    "bessible.api.ckan.DatastoreSearchRequest",
    "bessible.api.ckan.DatastoreSearchSqlRequest",
    "bessible.api.ckan.PackageSearchRequest",
    "bessible.api.ckan.PackageShowRequest",
    "bessible.api.nged._Record",
    "bessible.api.ssen_distribution._Record",
    "bessible.api.planning_data.EntityBase",
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
