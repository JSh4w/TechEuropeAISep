[project]
name = "bessible"
version = "0.1.0"
description = "BESS site assessment agent"
requires-python = ">=3.13,<3.15"
dependencies = [
    "httpx>=0.28.1",
    "modal>=1.5.5",
    "pydantic-ai-slim[anthropic,google,logfire,openai,temporal,typesafe]>=2.46.0",
    "pydantic-settings>=2.15.0",
    "temporalio>=1.33.0",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "missing-trailing-comma",
    "missing-copyright-notice",
    "docstring-missing-returns",
    "docstring-missing-exception",
    "no-self-use",
    "non-empty-init-module"
    ]

[tool.ruff.lint.per-file-ignores]
"test_*" = [
    "ANN",
    "D",
    "PLC",
    "PLR",
    "S",
    "ASYNC",
    "line-too-long",
    "float-equality-comparison",
    "complex-structure",
    "implicit-namespace-package",
    "raise-vanilla-args",
    "raw-string-in-exception",
    ]
"tests/*" = [
    "ANN",
    "D",
    "PLC",
    "PLR",
    "S",
    "ASYNC",
    "line-too-long",
    "float-equality-comparison",
    "complex-structure",
    "implicit-namespace-package",
    "raise-vanilla-args",
    "raw-string-in-exception",
    ]
"src/bessible/activities.py" = ["TC"]
"src/bessible/workflow.py" = ["TC"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
