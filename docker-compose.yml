services:
  temporal:
    image: temporalio/auto-setup:latest
    container_name: bessible-temporal
    environment:
      - DB=sqlite
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - temporal-data:/etc/temporal/schema
    networks:
      - bessible-internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${IMAGE_OWNER:-eskres}/bessible-backend:latest
    container_name: bessible-api
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - KEY_ENCRYPTION_SECRET=${KEY_ENCRYPTION_SECRET:-}
      - KEY_STORE_PATH=/var/lib/bessible/keys.db
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - CLASSIFIER_BACKEND=${CLASSIFIER_BACKEND:-auto}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OS_API_KEY=${OS_API_KEY:-}
      - SSEN_API_KEY=${SSEN_API_KEY:-}
      - UKPN_API_KEY=${UKPN_API_KEY:-}
      - NGED_API_KEY=${NGED_API_KEY:-}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - bessible-data:/var/lib/bessible
    networks:
      - bessible-internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.bessible-api.rule=Host(`${DOMAIN:-localhost}`) && PathPrefix(`/runs`, `/me`, `/demo`, `/capacity`, `/site-data`, `/inspire`, `/health`, `/data`)"
      - "traefik.http.routers.bessible-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.bessible-api.tls=true"
      - "traefik.http.routers.bessible-api.priority=100"
      - "traefik.http.routers.bessible-api.middlewares=${TRAEFIK_MIDDLEWARES_API:-security-headers@file}"
      - "traefik.http.services.bessible-api.loadbalancer.server.port=8000"
    depends_on:
      - temporal
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${IMAGE_OWNER:-eskres}/bessible-backend:latest
    container_name: bessible-worker
    command: ["python", "-m", "bessible.worker"]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - KEY_ENCRYPTION_SECRET=${KEY_ENCRYPTION_SECRET:-}
      - KEY_STORE_PATH=/var/lib/bessible/keys.db
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - CLASSIFIER_BACKEND=${CLASSIFIER_BACKEND:-auto}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OS_API_KEY=${OS_API_KEY:-}
      - SSEN_API_KEY=${SSEN_API_KEY:-}
      - UKPN_API_KEY=${UKPN_API_KEY:-}
      - NGED_API_KEY=${NGED_API_KEY:-}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - bessible-data:/var/lib/bessible
    networks:
      - bessible-internal
    depends_on:
      - temporal
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
        - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-}
        - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
        - FIREBASE_APP_ID=${FIREBASE_APP_ID:-}
    image: ghcr.io/${IMAGE_OWNER:-eskres}/bessible-web:latest
    container_name: bessible-web
    environment:
      - PORT=3000
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.bessible-web.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.bessible-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.bessible-web.tls=true"
      - "traefik.http.routers.bessible-web.priority=10"
      - "traefik.http.routers.bessible-web.middlewares=${TRAEFIK_MIDDLEWARES_WEB:-security-headers@file,rate-limit@file}"
      - "traefik.http.services.bessible-web.loadbalancer.server.port=3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  temporal-data:
  bessible-data:

networks:
  bessible-internal:
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true
