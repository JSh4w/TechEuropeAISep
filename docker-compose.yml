services:
  temporal:
    image: temporalio/auto-setup:latest
    container_name: bessible-temporal
    environment:
      - DB=sqlite
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - temporal-data:/etc/temporal/schema
    networks:
      - bessible-internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${IMAGE_OWNER:-eskres}/bessible-backend:latest
    container_name: bessible-api
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - KEY_ENCRYPTION_SECRET=${KEY_ENCRYPTION_SECRET:-}
      - KEY_STORE_PATH=/var/lib/bessible/keys.db
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - CLASSIFIER_BACKEND=${CLASSIFIER_BACKEND:-auto}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OS_API_KEY=${OS_API_KEY:-}
      - SSEN_API_KEY=${SSEN_API_KEY:-}
      - UKPN_API_KEY=${UKPN_API_KEY:-}
      - NGED_API_KEY=${NGED_API_KEY:-}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - bessible-data:/var/lib/bessible
    networks:
      - bessible-internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}"
      # Self-contained middlewares (Docker provider) so nothing depends on shared Traefik host config.
      - "traefik.http.middlewares.bessible-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.bessible-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.bessible-security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.bessible-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.bessible-security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.bessible-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      # Stricter than web: /runs, /me/key/test etc. trigger billed Gemini/Modal calls per request.
      - "traefik.http.middlewares.bessible-api-ratelimit.ratelimit.average=${RATE_LIMIT_API_AVERAGE:-5}"
      - "traefik.http.middlewares.bessible-api-ratelimit.ratelimit.burst=${RATE_LIMIT_API_BURST:-10}"
      - "traefik.http.middlewares.bessible-api-ratelimit.ratelimit.period=1s"
      - "traefik.http.routers.bessible-api.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/runs`) || PathPrefix(`/me`) || PathPrefix(`/demo`) || PathPrefix(`/capacity`) || PathPrefix(`/site-data`) || PathPrefix(`/inspire`) || PathPrefix(`/health`) || PathPrefix(`/data`))"
      - "traefik.http.routers.bessible-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.bessible-api.tls=true"
      - "traefik.http.routers.bessible-api.priority=100"
      - "traefik.http.routers.bessible-api.middlewares=${TRAEFIK_MIDDLEWARES_API:-bessible-security-headers@docker,bessible-api-ratelimit@docker}"
      - "traefik.http.services.bessible-api.loadbalancer.server.port=8000"
    depends_on:
      - temporal
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${IMAGE_OWNER:-eskres}/bessible-backend:latest
    container_name: bessible-worker
    command: ["python", "-m", "bessible.worker"]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - KEY_ENCRYPTION_SECRET=${KEY_ENCRYPTION_SECRET:-}
      - KEY_STORE_PATH=/var/lib/bessible/keys.db
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - CLASSIFIER_BACKEND=${CLASSIFIER_BACKEND:-auto}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OS_API_KEY=${OS_API_KEY:-}
      - SSEN_API_KEY=${SSEN_API_KEY:-}
      - UKPN_API_KEY=${UKPN_API_KEY:-}
      - NGED_API_KEY=${NGED_API_KEY:-}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - bessible-data:/var/lib/bessible
    networks:
      - bessible-internal
    depends_on:
      - temporal
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
        - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-}
        - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
        - FIREBASE_APP_ID=${FIREBASE_APP_ID:-}
    image: ghcr.io/${IMAGE_OWNER:-eskres}/bessible-web:latest
    container_name: bessible-web
    environment:
      - PORT=3000
      - AUTH_ENABLED=${AUTH_ENABLED:-}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_APP_ID=${FIREBASE_APP_ID:-}
    env_file:
      - path: .env
        required: false
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}"
      # Looser than the API: normal page/asset traffic, no billed calls behind it.
      - "traefik.http.middlewares.bessible-web-ratelimit.ratelimit.average=${RATE_LIMIT_WEB_AVERAGE:-20}"
      - "traefik.http.middlewares.bessible-web-ratelimit.ratelimit.burst=${RATE_LIMIT_WEB_BURST:-40}"
      - "traefik.http.middlewares.bessible-web-ratelimit.ratelimit.period=1s"
      - "traefik.http.routers.bessible-web.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.bessible-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.bessible-web.tls=true"
      - "traefik.http.routers.bessible-web.priority=10"
      - "traefik.http.routers.bessible-web.middlewares=${TRAEFIK_MIDDLEWARES_WEB:-bessible-security-headers@docker,bessible-web-ratelimit@docker}"
      - "traefik.http.services.bessible-web.loadbalancer.server.port=3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  temporal-data:
  bessible-data:

networks:
  bessible-internal:
  proxy:
    name: ${TRAEFIK_NETWORK:-traefik_proxy}
    external: true
